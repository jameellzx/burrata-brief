<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  function b64d(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function open(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.i)}, key, b64d(P.c));
    return new TextDecoder().decode(pt);
  }
  async function tryOpen(pw, remember){
    var html = await open(pw);
    sessionStorage.setItem('bb_pw', pw);
    if (remember) localStorage.setItem('bb_pw', pw);
    document.open(); document.write(html); document.close();
  }
  var saved = localStorage.getItem('bb_pw') || sessionStorage.getItem('bb_pw');
  if (saved) tryOpen(saved, false).catch(function(){ localStorage.removeItem('bb_pw'); sessionStorage.removeItem('bb_pw'); });
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var b = document.getElementById('go'), err = document.getElementById('err');
    b.disabled = true; err.textContent = '';
    tryOpen(document.getElementById('pw').value, document.getElementById('rm').checked)
      .catch(function(){ err.textContent = 'Wrong password. Try again.'; b.disabled = false; });
  });
})();
</script>
